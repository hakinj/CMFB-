services:
  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    ports:
      - "3000:3000"
      

    restart: unless-stopped